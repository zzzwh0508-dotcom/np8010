{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// 尺寸（m），和 make_2d.py 一致
const L = 10, R = 0.4, APRON = 0.8, CLEAR = 0.5;
const C = 0.5, A_STORZ = 1.3, VENT_X = 1.0, DRAIN_X = 0.6, VALVE_Z = 0.21;
const DRING_X = Array.from({ length: 9 }, (_, i) => 0.8 + i * 1.0), DRING_ANG = 55;
const CONN_FROM_END = 0.7, STRAP_ANG = [60, 120], N_EYELET = 14;
const BODY0 = C, BODY1 = C + L, APRON1 = BODY1 - CLEAR;
const SHIFT = -BODY1 / 2;  // 单节居中

// 充水后的截面：按名义 Ø800，只略扁一点、底部贴地压平；周长等于 Ø800 的周长
const SA = 0.41, SB = 0.39, HC = 0.385;  // 半宽、半高、中心高
const CAP = 0.28;                           // 两端封头圆顶的长度
const XA = BODY0 + CAP;                     // 套筒和筒体相接的位置
const TAU = Math.PI * 2, NV = 160, rad = THREE.MathUtils.degToRad;

// ---------- 工具 ----------
const smooth = t => t * t * (3 - 2 * t);
const wrap = (k, p) => p ? ((k % p) + p) % p : k;
function hash(i, j) { const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); }
function noise(x, y, px = 0, py = 0) {  // 值噪声 -1..1，px / py 是循环周期
  const i = Math.floor(x), j = Math.floor(y), fx = smooth(x - i), fy = smooth(y - j);
  const i0 = wrap(i, px), i1 = wrap(i + 1, px), j0 = wrap(j, py), j1 = wrap(j + 1, py);
  const a = hash(i0, j0), b = hash(i1, j0), c = hash(i0, j1), d = hash(i1, j1);
  return (a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy) * 2 - 1;
}
function normal(a, b, phi) {  // 截面 phi 处的外法线 (z, y)；phi 从顶部算，+z 为裙边一侧
  let nz = Math.sin(phi) / a, ny = Math.cos(phi) / b;
  const l = Math.hypot(nz, ny);
  return [nz / l, ny / l];
}

// ---------- 筒体 ----------
const FOLDS = [1.3, 2.7, 3.8, 5.2, 6.3, 7.6, 8.8].map(v => BODY0 + v);  // 运输折痕
function capScale(x) {
  const d = Math.min(x - BODY0, BODY1 - x);
  if (d >= CAP) return 1;
  const t = 1 - Math.max(d, 0) / CAP;
  return Math.sqrt(Math.max(1 - t * t, 0));
}
function bodyPoint(x, phi, lift = 0, out = new THREE.Vector3()) {
  const s = capScale(x);
  const z0 = SA * s * Math.sin(phi), y0 = HC + SB * s * Math.cos(phi);
  if (y0 <= 0.004) return out.set(x, 0.004 + lift, z0);  // 贴地压平
  const [nz, ny] = normal(SA, SB, phi);
  const p = wrap(phi, TAU) / TAU;
  let d = 0.0045 * noise(x * 1.1, p * 10, 0, 10) + 0.002 * noise(x * 3.7 + 9, p * 26, 0, 26);
  for (const f of FOLDS) d -= 0.0035 * Math.exp(-(((x - f) / 0.03) ** 2)) * (0.7 + 0.3 * noise(f * 9, p * 6, 0, 6));
  if (s < 1) d += 0.044 * s * (1 - s) * Math.sin(18 * p * TAU + 2.5 * noise(x * 6, p * 5, 0, 5));  // 封头褶
  for (const xs of [BODY0 + CAP, BODY1 - CAP]) d += 0.002 * Math.exp(-(((x - xs) / 0.01) ** 2));  // 封头焊缝
  d = d * Math.min(1, (y0 - 0.004) / 0.05) + lift;
  return out.set(x, y0 + ny * d, z0 + nz * d);
}

// ---------- 套筒：保持圆口（没插东西时口部略塌一点）；插上下一节时套住平头端 ----------
function collarParams(x, fitted) {
  const t = 1 - x / XA;  // 0 = 接筒体处，1 = 套筒口
  if (fitted) return [SA * 1.06, SB * 1.06, HC + 0.006, t];
  const e = smooth(t);
  return [SA * 1.06 + 0.015 * e, SB * 1.06 - 0.02 * e, HC + 0.006 - 0.02 * e, t];
}
function collarPoint(x, phi, fitted, lift = 0, out = new THREE.Vector3()) {
  const [a, b, hc, t] = collarParams(x, fitted);
  const z0 = a * Math.sin(phi), y0 = hc + b * Math.cos(phi);
  if (y0 <= 0.012) return out.set(x, 0.012 + lift, z0);
  const [nz, ny] = normal(a, b, phi);
  const p = wrap(phi, TAU) / TAU;
  const amp = fitted ? 0.006 * t : 0.01 * t * t;
  let d = amp * Math.sin(p * TAU * 7 + 1.3 + 1.5 * noise(x * 4, p * 4, 0, 4)) + 0.003 * noise(x * 3, p * 12, 0, 12);
  d = d * Math.min(1, (y0 - 0.012) / 0.06) + lift;
  return out.set(x, y0 + ny * d, z0 + nz * d);
}

// ---------- 几何 ----------
function tubeGrid(xs, fn) {  // xs 递增；fn(x, phi, v) 写入点
  const pos = [], uv = [], idx = [], v = new THREE.Vector3();
  for (const x of xs) for (let j = 0; j <= NV; j++) {
    fn(x, j / NV * TAU, v);
    pos.push(v.x, v.y, v.z);
    uv.push(x / 0.8, j / NV * 2.5 / 0.8);
  }
  for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < NV; j++) {
    const a = i * (NV + 1) + j, b = a + NV + 1;
    idx.push(a, a + 1, b, b, a + 1, b + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function planeGrid(nx, nz, fn) {  // fn(u, w, v)，u、w 在 0..1
  const pos = [], idx = [], v = new THREE.Vector3(), uv = [];
  for (let i = 0; i <= nx; i++) for (let k = 0; k <= nz; k++) {
    fn(i / nx, k / nz, v);
    pos.push(v.x, v.y, v.z);
    uv.push(v.x / 0.8, v.z / 0.8);
  }
  for (let i = 0; i < nx; i++) for (let k = 0; k < nz; k++) {
    const a = i * (nz + 1) + k, b = a + nz + 1;
    idx.push(a, a + 1, b, b, a + 1, b + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function patchGeometry(surf, x0, phi0, r, lift, a, b) {  // 贴合在表面上的圆形加强片
  const ds = Math.hypot(a * Math.cos(phi0), b * Math.sin(phi0));
  const rings = 6, segs = 32, pos = [], idx = [], v = new THREE.Vector3();
  surf(x0, phi0, lift, v);
  pos.push(v.x, v.y, v.z);
  for (let k = 1; k <= rings; k++) for (let s = 0; s < segs; s++) {
    const t = s / segs * TAU, rr = r * k / rings;
    surf(x0 + rr * Math.cos(t), phi0 + rr * Math.sin(t) / ds, lift, v);
    pos.push(v.x, v.y, v.z);
  }
  for (let s = 0; s < segs; s++) idx.push(0, 1 + s, 1 + (s + 1) % segs);
  for (let k = 1; k < rings; k++) for (let s = 0; s < segs; s++) {
    const a0 = 1 + (k - 1) * segs + s, a1 = 1 + (k - 1) * segs + (s + 1) % segs;
    idx.push(a0, a0 + segs, a1, a1, a0 + segs, a1 + segs);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// ---------- 贴图 ----------
function canvasTex(size, paint) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d"), img = g.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const [r, gg, b] = paint(x, y), o = (y * size + x) * 4;
    img.data[o] = r; img.data[o + 1] = gg; img.data[o + 2] = b; img.data[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return c;
}
const bumpCanvas = canvasTex(256, (x, y) => {
  const n = 0.6 * noise(x / 32, y / 32, 8, 8) + 0.4 * noise(x / 8, y / 8, 32, 32);
  const v = 128 + n * 60;
  return [v, v, v];
});
const fabricBump = new THREE.CanvasTexture(bumpCanvas);
fabricBump.wrapS = fabricBump.wrapT = THREE.RepeatWrapping;
const floorCanvas = canvasTex(512, (x, y) => {
  const n = 0.5 * noise(x / 60, y / 60, 0, 0) + 0.3 * noise(x / 11 + 50, y / 11) + 0.2 * (hash(x, y) * 2 - 1);
  const edge = Math.min(x, y, 511 - x, 511 - y) < 1 ? -26 : 0;  // 地坪分缝
  const v = 172 + n * 9 + edge;
  return [v, v, v + 2];
});
const floorTex = new THREE.CanvasTexture(floorCanvas);
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(16, 8);
floorTex.colorSpace = THREE.SRGBColorSpace;
floorTex.anisotropy = 8;

// ---------- 场景 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
Object.assign(renderer.domElement.style, { position: "fixed", left: "0", top: "0" });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
document.body.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: "fixed", left: "0", top: "0", pointerEvents: "none", zIndex: "1" });  // 编号压在面板下面
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe2e5);
scene.fog = new THREE.Fog(0xdfe2e5, 24, 60);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa0a6, 0.25));
const sun = new THREE.DirectionalLight(0xfff6ec, 1.9);
sun.position.set(-4, 12, 7);
sun.castShadow = true;
const small = Math.min(innerWidth, innerHeight) < 700;  // 手机上阴影贴图降一档
sun.shadow.mapSize.set(small ? 2048 : 4096, small ? 2048 : 4096);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 8, bottom: -8, near: 1, far: 40 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 40),
  new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.85, envMapIntensity: 0.5 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const pvc = new THREE.MeshPhysicalMaterial({ color: 0xe9541a, roughness: 0.5, clearcoat: 0.2, clearcoatRoughness: 0.5,
  bumpMap: fabricBump, bumpScale: 1.2, envMapIntensity: 0.6 });
const apronMat = new THREE.MeshStandardMaterial({ color: 0xea561b, roughness: 0.62, bumpMap: fabricBump, bumpScale: 0.8,
  envMapIntensity: 0.45, side: THREE.DoubleSide });
const pvc2 = pvc.clone();
pvc2.side = THREE.DoubleSide;
const pvcPatch = new THREE.MeshPhysicalMaterial({ color: 0xe04d16, roughness: 0.45, clearcoat: 0.3, envMapIntensity: 0.6, side: THREE.DoubleSide });
const pvcRim = new THREE.MeshStandardMaterial({ color: 0xbf4312, roughness: 0.6, envMapIntensity: 0.5, side: THREE.DoubleSide });
const steel = new THREE.MeshStandardMaterial({ color: 0xd8dce0, metalness: 1, roughness: 0.22 });
const alu = new THREE.MeshStandardMaterial({ color: 0xc9ced3, metalness: 0.9, roughness: 0.32 });
const greyPVC = new THREE.MeshStandardMaterial({ color: 0xb4b9bd, roughness: 0.5, envMapIntensity: 0.6 });
const handleRed = new THREE.MeshStandardMaterial({ color: 0xd8431b, roughness: 0.4 });
const black = new THREE.MeshStandardMaterial({ color: 0x1f2328, roughness: 0.75, side: THREE.DoubleSide });

function mesh(geo, mat, parent) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
// 表面上的局部坐标：原点在 p，+Y 外法线，+Z 沿表面朝顶部，+X 沿筒体
function frameAt(parent, p, a, b, phi) {
  const [nz, ny] = normal(a, b, phi);
  const sg = Math.sin(phi) >= 0 ? 1 : -1;
  let tz = -sg * a * Math.cos(phi), ty = sg * b * Math.sin(phi);
  const l = Math.hypot(tz, ty);
  const Y = new THREE.Vector3(0, ny, nz), Z = new THREE.Vector3(0, ty / l, tz / l);
  const X = new THREE.Vector3().crossVectors(Y, Z);
  const g = new THREE.Group();
  g.position.copy(p);
  g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(X, Y, Z));
  parent.add(g);
  return g;
}
const bodySurf = (x, phi, lift, v) => bodyPoint(x, phi, lift, v);
function patch(parent, surf, x, phi, r, a = SA, b = SB) {  // 加强片 + 一圈焊边
  mesh(patchGeometry(surf, x, phi, r + 0.01, 0.0012, a, b), pvcRim, parent);
  mesh(patchGeometry(surf, x, phi, r, 0.0028, a, b), pvcPatch, parent);
}
function ribbon(parent, pts, ups, w, mat) {  // 扁带：沿 pts，宽度方向 = 切线 × 表面法线
  const curve = new THREE.CatmullRomCurve3(pts), N = 40, ps = curve.getPoints(N), pos = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const t = curve.getTangent(i / N), k = i / N * (ups.length - 1), k0 = Math.floor(k);
    const up = ups[k0].clone().lerp(ups[Math.min(k0 + 1, ups.length - 1)], k - k0).normalize();
    const side = new THREE.Vector3().crossVectors(t, up).normalize().multiplyScalar(w / 2);
    pos.push(...ps[i].clone().add(side).toArray(), ...ps[i].clone().sub(side).toArray());
    if (i < N) idx.push(2 * i, 2 * i + 1, 2 * i + 2, 2 * i + 1, 2 * i + 3, 2 * i + 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return mesh(g, mat, parent);
}
function snapHook(parent, p, toward) {
  const g = new THREE.Group();
  g.position.copy(p);
  parent.add(g);
  g.lookAt(parent.localToWorld(toward.clone()));
  const h = mesh(new THREE.TorusGeometry(0.019, 0.0038, 8, 28), steel, g);
  h.rotation.x = Math.PI / 2;
  h.scale.set(1, 1.7, 1);
  h.position.z = 0.03;
  return g;
}
const tags = [];
function tag(n, parent, pos) {
  const d = document.createElement("div");
  d.className = "tag";
  d.textContent = n;
  const o = new CSS2DObject(d);
  o.position.copy(pos);
  parent.add(o);
  tags.push(o);
}

function dring(parent, x, phi) {
  const p = bodyPoint(x, phi);
  patch(parent, bodySurf, x, phi, 0.07);
  const g = frameAt(parent, p, SA, SB, phi);
  mesh(new THREE.BoxGeometry(0.05, 0.005, 0.034), pvcPatch, g).position.set(0, 0.005, -0.012);
  const ring = mesh(new THREE.TorusGeometry(0.026, 0.0042, 8, 24, Math.PI), steel, g);
  ring.rotation.x = Math.PI / 2 - 0.3;
  ring.position.set(0, 0.009, -0.012);
  const bar = mesh(new THREE.CylinderGeometry(0.0042, 0.0042, 0.052, 8), steel, g);
  bar.rotation.z = Math.PI / 2;
  bar.position.set(0, 0.009, -0.012);
}

function ballValve(parent) {  // 法兰夹紧筒体，灰色 PVC 球阀，红色扳手
  const phi = Math.acos((VALVE_Z - HC) / SB), x = BODY0 + DRAIN_X;
  const g0 = new THREE.Group();
  parent.add(g0);
  patch(g0, bodySurf, x, phi, 0.1);
  const g = frameAt(g0, bodyPoint(x, phi, 0.002), SA, SB, phi);
  mesh(new THREE.CylinderGeometry(0.065, 0.066, 0.012, 40), greyPVC, g).position.y = 0.006;
  for (let i = 0; i < 6; i++) {
    const t = i / 6 * TAU + 0.3;
    mesh(new THREE.CylinderGeometry(0.0065, 0.0065, 0.006, 6), steel, g).position.set(0.052 * Math.cos(t), 0.015, 0.052 * Math.sin(t));
  }

function sweep(curve, n, m, prof) {  // 沿曲线扫出软管；prof(s) 返回 [宽半轴, 厚半轴]，宽度方向尽量水平
  const pos = [], uv = [], idx = [], X = new THREE.Vector3(1, 0, 0);
  for (let i = 0; i <= n; i++) {
    const s = i / n, P = curve.getPointAt(s), T = curve.getTangentAt(s);
    const W = X.clone().addScaledVector(T, -T.x).normalize(), H = new THREE.Vector3().crossVectors(T, W);
    const [w, h] = prof(s);
    for (let j = 0; j <= m; j++) {
      const t = j / m * TAU, k = 1 + (0.1 * Math.sin(5 * t + 9 * s) + 0.05 * Math.sin(11 * t - 23 * s)) * Math.min(1, s * 4);
      pos.push(...P.clone().addScaledVector(W, w * k * Math.cos(t)).addScaledVector(H, h * k * Math.sin(t)).toArray());
      uv.push(s, j / m);
    }
  }
  for (let i = 0; i < n; i++) for (let j = 0; j < m; j++) {
    const a = i * (m + 1) + j, b = a + m + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function drainSleeve(parent) {  // 软袖口：从筒体下部伸出，垂到裙边上，末端卷起，用松紧绳扎住
  const phi = rad(108), x = BODY0 + DRAIN_X;
  const g = new THREE.Group();
  parent.add(g);
  patch(g, bodySurf, x, phi, 0.09);
  const [nz, ny] = normal(SA, SB, phi), n = new THREE.Vector3(0, ny, nz);
  const p0 = bodyPoint(x, phi, -0.01), RR = 0.034;

  const curve = new THREE.CatmullRomCurve3([
    p0, p0.clone().addScaledVector(n, 0.07),
    new THREE.Vector3(x + 0.01, 0.13, p0.z + 0.15),
    new THREE.Vector3(x + 0.02, rollC.y + RR * 0.75, rollC.z - RR * 0.65),
  ]);
  mesh(sweep(curve, 48, 32, s => {
    const e = smooth(Math.min(s / 0.4, 1));

  }), sleeveMat, g);
  const root = frameAt(g, bodyPoint(x, phi, 0.003), SA, SB, phi);  // 根部焊圈
  mesh(new THREE.TorusGeometry(0.05, 0.007, 8, 32), pvcRim, root).rotation.x = Math.PI / 2;

  const N = 90, turns = 2.6, r0 = 0.008, th = 0.006, off = rad(49) - (turns * TAU % TAU), pts = [];
  for (let k = 0; k <= N; k++) {

    pts.push(new THREE.Vector2(r * Math.cos(a), r * Math.sin(a)));

  for (const k of [-1, 1]) {

  iso:    { pos: [-2.8, 4.4, 12.2], tgt: [0.1, 0.3, 0.3], tall: { pos: [-14.5, 17.5, 5.0], tgt: [0.6, -0.6, 0.4] } },
  top:    { pos: [0, 16, 0.01],     tgt: [0, 0, 0.4] },
  side:   { pos: [0, 0.8, 15],      tgt: [0, 0.4, 0.4] },
  collar: { pos: [-7.2, 1.7, 3.1],  tgt: [-4.7, 0.42, 0.3] },
  storz:  { pos: [7.0, 2.0, 2.6],   tgt: [3.9, 0.5, 0.1] },
  valve:  { pos: [-3.25, 0.62, 1.5], tgt: [-4.12, 0.24, 0.42] },
  joint:  { pos: [2.6, 2.4, 4.4],   tgt: [4.75, 0.4, 0.2], two: true },
};
function setView(v) {
  let p = VIEWS[v] || VIEWS.iso;
  if (camera.aspect < 1 && p.tall) p = { ...p, ...p.tall, tall: null, fixed: true };  // 竖屏看整体：顺着管子斜着看
  mod2.group.visible = !!p.two;
  const tgt = new THREE.Vector3(...p.tgt), k = camera.aspect < 1 && !p.fixed ? Math.min(2.2, 0.85 / camera.aspect) : 1;  // 竖屏手机拉远一点
  camera.position.copy(tgt).addScaledVector(new THREE.Vector3(...p.pos).sub(tgt), k);
  controls.target.copy(tgt);
  controls.update();
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
}
const params = new URLSearchParams(location.hash.slice(1).replace(/^(\w+)$/, "v=$1"));
document.getElementById("views").addEventListener("click", e => {
  if (!e.target.dataset.v) return;
  setView(e.target.dataset.v);
  history.replaceState(null, "", "#" + e.target.dataset.v);  // 只放视图名，链接里能带过去
});
document.getElementById("drain").addEventListener("click", e => {
  if (!e.target.dataset.d) return;
  setDrain(e.target.dataset.d);
});
document.getElementById("lang").addEventListener("click", e => {
  if (!e.target.dataset.l) return;
  setLang(e.target.dataset.l);
});
document.getElementById("lbl").addEventListener("change", e => tags.forEach(t => t.visible = e.target.checked));
document.getElementById("dims").addEventListener("change", e => showDims(e.target.checked));
if (innerWidth <= 600) document.getElementById("info").open = false;  // 手机上说明默认收起，点开看
let saved = null;
try { saved = localStorage.getItem("np8010-lang"); } catch (e) { /* 无痕模式等 */ }
lang = TEXT[params.get("lang")] ? params.get("lang") : (TEXT[saved] ? saved : "zh");
setView(params.get("v") || "iso");
addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS[v]) setView(v); });
setDrain(params.get("drain") || "valve");
if (params.get("labels") === "0") { document.getElementById("lbl").checked = false; tags.forEach(t => t.visible = false); }
if (params.get("dims") === "0") { document.getElementById("dims").checked = false; showDims(false); }
if (params.get("ui") === "0") document.getElementById("panel").style.display = document.querySelector(".hint").style.display = "none";

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
</script>
