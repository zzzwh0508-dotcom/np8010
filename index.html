<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// 尺寸（m），和 make_2d.py 一致
const L = 10, R = 0.4, APRON = 0.8, CLEAR = 0.5;
const C = 0.5, A_STORZ = 1.3, VENT_X = 1.0, DRAIN_X = 0.6, DRAIN_Z = 0.2;  // DRAIN_Z：出水袖口中心离地高度
const CONN_Z = [0.6, 0.2];  // 连接 D 环（60° / 120°）离地高度，按名义 Ø800 标注
const DRING_X = Array.from({ length: 9 }, (_, i) => 0.8 + i * 1.0), DRING_ANG = 55;
const CONN_FROM_END = 0.7, STRAP_ANG = [60, 120], N_EYELET = 14;
const BODY0 = C, BODY1 = C + L, APRON1 = BODY1 - CLEAR;
// 鸡眼：裙边两头各留 320，中间 13 个间距 720（和 2D DRAFT-03 一致）
const EYE_END = 0.32, EYE_PITCH = (APRON1 - 2 * EYE_END) / (N_EYELET - 1);
// 套筒上的绑带：固定短带缝在 X_ANCHOR，伸缩扣在 X_BUCKLE（都是到套筒口的距离）
const X_ANCHOR = 0.44, X_BUCKLE = 0.24, STRAP_W = 0.038;
const SHIFT = -BODY1 / 2;  // 单节居中

// 充水后的截面：按名义 Ø800，只略扁一点、底部贴地压平；周长等于 Ø800 的周长
const SA = 0.41, SB = 0.39, HC = 0.385;  // 半宽、半高、中心高
const CAP = 0.28;                           // 两端封头圆顶的长度
const XA = BODY0 + CAP;                     // 套筒和筒体相接的位置
const TAU = Math.PI * 2, NV = 160, rad = THREE.MathUtils.degToRad;

// ---------- 工具 ----------
const smooth = t => t * t * (3 - 2 * t);
const wrap = (k, p) => p ? ((k % p) + p) % p : k;
function hash(i, j) { const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); }
function noise(x, y, px = 0, py = 0) {  // 值噪声 -1..1，px / py 是循环周期
  const i = Math.floor(x), j = Math.floor(y), fx = smooth(x - i), fy = smooth(y - j);
  const i0 = wrap(i, px), i1 = wrap(i + 1, px), j0 = wrap(j, py), j1 = wrap(j + 1, py);
  const a = hash(i0, j0), b = hash(i1, j0), c = hash(i0, j1), d = hash(i1, j1);
  return (a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy) * 2 - 1;
}
function normal(a, b, phi) {  // 截面 phi 处的外法线 (z, y)；phi 从顶部算，+z 为裙边一侧
  let nz = Math.sin(phi) / a, ny = Math.cos(phi) / b;
  const l = Math.hypot(nz, ny);
  return [nz / l, ny / l];
}

// ---------- 筒体 ----------
const FOLDS = [1.3, 2.7, 3.8, 5.2, 6.3, 7.6, 8.8].map(v => BODY0 + v);  // 运输折痕
function capScale(x) {
  const d = Math.min(x - BODY0, BODY1 - x);
  if (d >= CAP) return 1;
  const t = 1 - Math.max(d, 0) / CAP;
  return Math.sqrt(Math.max(1 - t * t, 0));
}
function bodyPoint(x, phi, lift = 0, out = new THREE.Vector3()) {
  const s = capScale(x);
  const z0 = SA * s * Math.sin(phi), y0 = HC + SB * s * Math.cos(phi);
  if (y0 <= 0.004) return out.set(x, 0.004 + lift, z0);  // 贴地压平
  const [nz, ny] = normal(SA, SB, phi);
  const p = wrap(phi, TAU) / TAU;
  let d = 0.0045 * noise(x * 1.1, p * 10, 0, 10) + 0.002 * noise(x * 3.7 + 9, p * 26, 0, 26);
  for (const f of FOLDS) d -= 0.0035 * Math.exp(-(((x - f) / 0.03) ** 2)) * (0.7 + 0.3 * noise(f * 9, p * 6, 0, 6));
  if (s < 1) d += 0.044 * s * (1 - s) * Math.sin(18 * p * TAU + 2.5 * noise(x * 6, p * 5, 0, 5));  // 封头褶
  for (const xs of [BODY0 + CAP, BODY1 - CAP]) d += 0.002 * Math.exp(-(((x - xs) / 0.01) ** 2));  // 封头焊缝
  d = d * Math.min(1, (y0 - 0.004) / 0.05) + lift;
  return out.set(x, y0 + ny * d, z0 + nz * d);
}

// ---------- 套筒：保持圆口（没插东西时口部略塌一点）；插上下一节时套住平头端 ----------
function collarParams(x, fitted) {
  const t = 1 - x / XA;  // 0 = 接筒体处，1 = 套筒口
  if (fitted) return [SA * 1.06, SB * 1.06, HC + 0.006, t];
  const e = smooth(t);
  return [SA * 1.06 + 0.015 * e, SB * 1.06 - 0.02 * e, HC + 0.006 - 0.02 * e, t];
}
function collarPoint(x, phi, fitted, lift = 0, out = new THREE.Vector3()) {
  const [a, b, hc, t] = collarParams(x, fitted);
  const z0 = a * Math.sin(phi), y0 = hc + b * Math.cos(phi);
  if (y0 <= 0.012) return out.set(x, 0.012 + lift, z0);
  const [nz, ny] = normal(a, b, phi);
  const p = wrap(phi, TAU) / TAU;
  const amp = fitted ? 0.006 * t : 0.01 * t * t;
  let d = amp * Math.sin(p * TAU * 7 + 1.3 + 1.5 * noise(x * 4, p * 4, 0, 4)) + 0.003 * noise(x * 3, p * 12, 0, 12);
  d = d * Math.min(1, (y0 - 0.012) / 0.06) + lift;
  return out.set(x, y0 + ny * d, z0 + nz * d);
}

// ---------- 几何 ----------
function tubeGrid(xs, fn) {  // xs 递增；fn(x, phi, v) 写入点
  const pos = [], uv = [], idx = [], v = new THREE.Vector3();
  for (const x of xs) for (let j = 0; j <= NV; j++) {
    fn(x, j / NV * TAU, v);
    pos.push(v.x, v.y, v.z);
    uv.push(x / 0.8, j / NV * 2.5 / 0.8);
  }
  for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < NV; j++) {
    const a = i * (NV + 1) + j, b = a + NV + 1;
    idx.push(a, a + 1, b, b, a + 1, b + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function planeGrid(nx, nz, fn) {  // fn(u, w, v)，u、w 在 0..1
  const pos = [], idx = [], v = new THREE.Vector3(), uv = [];
  for (let i = 0; i <= nx; i++) for (let k = 0; k <= nz; k++) {
    fn(i / nx, k / nz, v);
    pos.push(v.x, v.y, v.z);
    uv.push(v.x / 0.8, v.z / 0.8);
  }
  for (let i = 0; i < nx; i++) for (let k = 0; k < nz; k++) {
    const a = i * (nz + 1) + k, b = a + nz + 1;
    idx.push(a, a + 1, b, b, a + 1, b + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function patchGeometry(surf, x0, phi0, r, lift, a, b) {  // 贴合在表面上的圆形加强片
  const ds = Math.hypot(a * Math.cos(phi0), b * Math.sin(phi0));
  const rings = 6, segs = 32, pos = [], idx = [], v = new THREE.Vector3();
  surf(x0, phi0, lift, v);
  pos.push(v.x, v.y, v.z);
  for (let k = 1; k <= rings; k++) for (let s = 0; s < segs; s++) {
    const t = s / segs * TAU, rr = r * k / rings;
    surf(x0 + rr * Math.cos(t), phi0 + rr * Math.sin(t) / ds, lift, v);
    pos.push(v.x, v.y, v.z);
  }
  for (let s = 0; s < segs; s++) idx.push(0, 1 + s, 1 + (s + 1) % segs);
  for (let k = 1; k < rings; k++) for (let s = 0; s < segs; s++) {
    const a0 = 1 + (k - 1) * segs + s, a1 = 1 + (k - 1) * segs + (s + 1) % segs;
    idx.push(a0, a0 + segs, a1, a1, a0 + segs, a1 + segs);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// ---------- 贴图 ----------
function canvasTex(size, paint) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d"), img = g.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const [r, gg, b] = paint(x, y), o = (y * size + x) * 4;
    img.data[o] = r; img.data[o + 1] = gg; img.data[o + 2] = b; img.data[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return c;
}
const bumpCanvas = canvasTex(256, (x, y) => {
  const n = 0.6 * noise(x / 32, y / 32, 8, 8) + 0.4 * noise(x / 8, y / 8, 32, 32);
  const v = 128 + n * 60;
  return [v, v, v];
});
const fabricBump = new THREE.CanvasTexture(bumpCanvas);
fabricBump.wrapS = fabricBump.wrapT = THREE.RepeatWrapping;
const floorCanvas = canvasTex(512, (x, y) => {
  const n = 0.5 * noise(x / 60, y / 60, 0, 0) + 0.3 * noise(x / 11 + 50, y / 11) + 0.2 * (hash(x, y) * 2 - 1);
  const edge = Math.min(x, y, 511 - x, 511 - y) < 1 ? -26 : 0;  // 地坪分缝
  const v = 172 + n * 9 + edge;
  return [v, v, v + 2];
});
const floorTex = new THREE.CanvasTexture(floorCanvas);
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(16, 8);
floorTex.colorSpace = THREE.SRGBColorSpace;
floorTex.anisotropy = 8;

// ---------- 场景 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
Object.assign(renderer.domElement.style, { position: "fixed", left: "0", top: "0" });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
document.body.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: "fixed", left: "0", top: "0", pointerEvents: "none", zIndex: "1" });  // 编号压在面板下面
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe2e5);
scene.fog = new THREE.Fog(0xdfe2e5, 24, 60);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa0a6, 0.25));
const sun = new THREE.DirectionalLight(0xfff6ec, 1.9);
sun.position.set(-4, 12, 7);
sun.castShadow = true;
const small = Math.min(innerWidth, innerHeight) < 700;  // 手机上阴影贴图降一档
sun.shadow.mapSize.set(small ? 2048 : 4096, small ? 2048 : 4096);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 8, bottom: -8, near: 1, far: 40 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 40),
  new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.85, envMapIntensity: 0.5 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const pvc = new THREE.MeshPhysicalMaterial({ color: 0xe9541a, roughness: 0.5, clearcoat: 0.2, clearcoatRoughness: 0.5,
  bumpMap: fabricBump, bumpScale: 1.2, envMapIntensity: 0.6 });
const apronMat = new THREE.MeshStandardMaterial({ color: 0xea561b, roughness: 0.62, bumpMap: fabricBump, bumpScale: 0.8,
  envMapIntensity: 0.45, side: THREE.DoubleSide });
const pvc2 = pvc.clone();
pvc2.side = THREE.DoubleSide;
const pvcPatch = new THREE.MeshPhysicalMaterial({ color: 0xe04d16, roughness: 0.45, clearcoat: 0.3, envMapIntensity: 0.6, side: THREE.DoubleSide });
const pvcRim = new THREE.MeshStandardMaterial({ color: 0xbf4312, roughness: 0.6, envMapIntensity: 0.5, side: THREE.DoubleSide });
const steel = new THREE.MeshStandardMaterial({ color: 0xd8dce0, metalness: 1, roughness: 0.22 });
const alu = new THREE.MeshStandardMaterial({ color: 0xc9ced3, metalness: 0.9, roughness: 0.32 });
const black = new THREE.MeshStandardMaterial({ color: 0x1f2328, roughness: 0.75, side: THREE.DoubleSide });

function mesh(geo, mat, parent) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
// 表面上的局部坐标：原点在 p，+Y 外法线，+Z 沿表面朝顶部，+X 沿筒体
function frameAt(parent, p, a, b, phi) {
  const [nz, ny] = normal(a, b, phi);
  const sg = Math.sin(phi) >= 0 ? 1 : -1;
  let tz = -sg * a * Math.cos(phi), ty = sg * b * Math.sin(phi);
  const l = Math.hypot(tz, ty);
  const Y = new THREE.Vector3(0, ny, nz), Z = new THREE.Vector3(0, ty / l, tz / l);
  const X = new THREE.Vector3().crossVectors(Y, Z);
  const g = new THREE.Group();
  g.position.copy(p);
  g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(X, Y, Z));
  parent.add(g);
  return g;
}
const bodySurf = (x, phi, lift, v) => bodyPoint(x, phi, lift, v);
function patch(parent, surf, x, phi, r, a = SA, b = SB) {  // 加强片 + 一圈焊边
  mesh(patchGeometry(surf, x, phi, r + 0.01, 0.0012, a, b), pvcRim, parent);
  mesh(patchGeometry(surf, x, phi, r, 0.0028, a, b), pvcPatch, parent);
}
function ribbon(parent, pts, ups, w, mat) {  // 扁带：沿 pts，宽度方向 = 切线 × 表面法线
  const curve = new THREE.CatmullRomCurve3(pts), N = 40, ps = curve.getPoints(N), pos = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const t = curve.getTangent(i / N), k = i / N * (ups.length - 1), k0 = Math.floor(k);
    const up = ups[k0].clone().lerp(ups[Math.min(k0 + 1, ups.length - 1)], k - k0).normalize();
    const side = new THREE.Vector3().crossVectors(t, up).normalize().multiplyScalar(w / 2);
    pos.push(...ps[i].clone().add(side).toArray(), ...ps[i].clone().sub(side).toArray());
    if (i < N) idx.push(2 * i, 2 * i + 1, 2 * i + 2, 2 * i + 1, 2 * i + 3, 2 * i + 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return mesh(g, mat, parent);
}
const caraMat = new THREE.MeshStandardMaterial({ color: 0x8e959c, metalness: 0.85, roughness: 0.3 });
const lockMat = new THREE.MeshStandardMaterial({ color: 0xf08a24, roughness: 0.45 });
function carabiner(parent, p, toward, n) {  // D 形带锁主锁：一头穿绑带末端，另一头挂相邻一节的 D 环；锁门上有橙色锁套
  const Z = toward.clone().sub(p).normalize();
  const Y = n.clone().addScaledVector(Z, -n.dot(Z)).normalize();
  const X = new THREE.Vector3().crossVectors(Y, Z);
  const g = new THREE.Group();
  g.position.copy(p);
  g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(X, Y, Z));
  parent.add(g);
  // 长轴沿 +Z（朝 D 环），长 100、宽 60；锁门是直边，在 -X 一侧
  const P = (x, z) => new THREE.Vector3(x - 0.026, 0.009, z + 0.052);
  const loop = new THREE.CatmullRomCurve3([
    P(0, -0.034), P(0, -0.012), P(0, 0.012), P(0, 0.034), P(0.007, 0.046), P(0.024, 0.052), P(0.042, 0.046),
    P(0.052, 0.026), P(0.055, 0), P(0.052, -0.026), P(0.042, -0.046), P(0.024, -0.052), P(0.007, -0.046),
  ], true, "centripetal");
  mesh(new THREE.TubeGeometry(loop, 140, 0.0046, 10, true), caraMat, g);
  const sleeve = mesh(new THREE.CylinderGeometry(0.0078, 0.0078, 0.032, 16), lockMat, g);  // 锁套
  sleeve.rotation.x = Math.PI / 2;
  sleeve.position.copy(P(0, -0.012));
  for (const dz of [-0.008, 0, 0.008]) {  // 锁套上的防滑槽

function camBuckle(parent, p, n) {  // 伸缩扣（凸轮扣）：长带穿过，拉带尾收紧，按下扣舌松开；局部 +X 沿筒体，+Y 外法线
  const Y = n.clone().normalize();
  const X = new THREE.Vector3(1, 0, 0).addScaledVector(Y, -Y.x).normalize();
  const Z = new THREE.Vector3().crossVectors(X, Y);
  const g = new THREE.Group();
  g.position.copy(p);
  g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(X, Y, Z));
  parent.add(g);
  mesh(new THREE.BoxGeometry(0.058, 0.004, 0.052), alu, g).position.y = 0.002;  // 底板
  for (const k of [1, -1]) mesh(new THREE.BoxGeometry(0.058, 0.017, 0.004), alu, g).position.set(0, 0.0085, 0.025 * k);  // 两侧耳板
  const pin = mesh(new THREE.CylinderGeometry(0.0032, 0.0032, 0.056, 10), steel, g);  // 销轴
  pin.rotation.x = Math.PI / 2;
  pin.position.set(-0.014, 0.013, 0);

  cam.position.set(-0.014, 0.013, 0);
  cam.rotation.z = 0.2;
  g.add(cam);
  mesh(new THREE.BoxGeometry(0.052, 0.004, 0.044), steel, cam).position.set(0.026, 0.004, 0);
  const lip = mesh(new THREE.CylinderGeometry(0.0048, 0.0048, 0.044, 12), steel, cam);
  lip.rotation.x = Math.PI / 2;
  lip.position.set(0.052, 0.006, 0);

function dring(parent, x, phi) {
  const p = bodyPoint(x, phi);
  patch(parent, bodySurf, x, phi, 0.07);
  const g = frameAt(parent, p, SA, SB, phi);
  mesh(new THREE.BoxGeometry(0.05, 0.005, 0.034), pvcPatch, g).position.set(0, 0.005, -0.012);
  const ring = mesh(new THREE.TorusGeometry(0.026, 0.0042, 8, 24, Math.PI), steel, g);
  ring.rotation.x = Math.PI / 2 - 0.3;
  ring.position.set(0, 0.009, -0.012);
  const bar = mesh(new THREE.CylinderGeometry(0.0042, 0.0042, 0.052, 8), steel, g);

const sleeveMat = new THREE.MeshPhysicalMaterial({ color: 0xe9541a, roughness: 0.5, clearcoat: 0.2, envMapIntensity: 0.6,
  side: THREE.DoubleSide });
function sweep(curve, n, m, prof) {  // 沿曲线扫出软管；prof(s) 返回 [宽半轴, 厚半轴]，宽度方向尽量水平
  const pos = [], uv = [], idx = [], X = new THREE.Vector3(1, 0, 0);
  for (let i = 0; i <= n; i++) {
    const s = i / n, P = curve.getPointAt(s), T = curve.getTangentAt(s);
    const W = X.clone().addScaledVector(T, -T.x).normalize(), H = new THREE.Vector3().crossVectors(T, W);
    const [w, h] = prof(s);
    for (let j = 0; j <= m; j++) {
      const t = j / m * TAU, k = 1 + (0.1 * Math.sin(5 * t + 9 * s) + 0.05 * Math.sin(11 * t - 23 * s)) * Math.min(1, s * 4);
      pos.push(...P.clone().addScaledVector(W, w * k * Math.cos(t)).addScaledVector(H, h * k * Math.sin(t)).toArray());
      uv.push(s, j / m);
    }
  }
  for (let i = 0; i < n; i++) for (let j = 0; j < m; j++) {
    const a = i * (m + 1) + j, b = a + m + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
const DRAIN_PHI = Math.acos((DRAIN_Z - HC) / SB);  // 袖口根部中心离地 DRAIN_Z 时的角度（约 118°）
function drainSleeve(parent) {  // 软袖口：从筒体下部伸出，垂到裙边上，末端卷起，用松紧绳扎住
  const phi = DRAIN_PHI, x = BODY0 + DRAIN_X;
  const g = new THREE.Group();
  parent.add(g);
  patch(g, bodySurf, x, phi, 0.09);
  const [nz, ny] = normal(SA, SB, phi), n = new THREE.Vector3(0, ny, nz);
  // 袖口长 500（2026-11-09 定）：垂下来铺在裙边上一段，末端卷起
  const p0 = bodyPoint(x, phi, -0.01), RR = 0.036;
  const rollC = new THREE.Vector3(x + 0.02, 0.006 + RR, p0.z + 0.36);
  const curve = new THREE.CatmullRomCurve3([
    p0, p0.clone().addScaledVector(n, 0.07),
    new THREE.Vector3(x + 0.01, 0.12, p0.z + 0.13),
    new THREE.Vector3(x + 0.015, 0.03, p0.z + 0.23),
    new THREE.Vector3(x + 0.02, rollC.y + RR * 0.75, rollC.z - RR * 0.65),
  ]);
  mesh(sweep(curve, 64, 32, s => {
    const e = smooth(Math.min(s / 0.3, 1));
    return [0.046 + 0.03 * e, 0.046 - 0.033 * e];  // 根部是圆口，往外逐渐压扁
  }), sleeveMat, g);
  const root = frameAt(g, bodyPoint(x, phi, 0.003), SA, SB, phi);  // 根部焊圈
  mesh(new THREE.TorusGeometry(0.05, 0.007, 8, 32), pvcRim, root).rotation.x = Math.PI / 2;
  // 卷起来的一卷：螺旋截面挤出，卷轴沿筒体方向，最外一层接到袖子上
  const N = 110, turns = 3.1, r0 = 0.008, th = 0.006, off = rad(49) - (turns * TAU % TAU), pts = [];
  for (let k = 0; k <= N; k++) {
    const a = k / N * turns * TAU + off, r = r0 + (RR - r0) * k / N;
    pts.push(new THREE.Vector2(r * Math.cos(a), r * Math.sin(a)));
  }
  for (let k = N; k >= 0; k--) {
    const a = k / N * turns * TAU + off, r = r0 + (RR - r0) * k / N - th;
    pts.push(new THREE.Vector2(r * Math.cos(a), r * Math.sin(a)));
  }
  const rollGeo = new THREE.ExtrudeGeometry(new THREE.Shape(pts), { depth: 0.14, bevelEnabled: false, steps: 1 });
  rollGeo.translate(0, 0, -0.07);
  rollGeo.rotateY(Math.PI / 2);
  mesh(rollGeo, sleeveMat, g).position.copy(rollC);
  // 两圈松紧绳，绳头带锁扣
  for (const k of [-1, 1]) {
    const c = new THREE.TorusGeometry(RR + 0.0035, 0.003, 6, 32);
    c.rotateY(Math.PI / 2);
    mesh(c, black, g).position.set(rollC.x + 0.035 * k, rollC.y, rollC.z);
    const knot = new THREE.Vector3(rollC.x + 0.035 * k, rollC.y + RR + 0.003, rollC.z);
    const end = new THREE.Vector3(rollC.x + 0.08 * k, 0.012, rollC.z + 0.14);
    const tail = new THREE.CatmullRomCurve3([knot, knot.clone().add(new THREE.Vector3(0.02 * k, 0.012, 0.05)), end]);
    mesh(new THREE.TubeGeometry(tail, 20, 0.003, 6, false), black, g);
    const lock = mesh(new THREE.CylinderGeometry(0.007, 0.007, 0.022, 10), black, g);
    lock.position.copy(end);
    lock.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tail.getTangentAt(1));
    mesh(new THREE.SphereGeometry(0.006, 10, 8), black, g).position.copy(end.clone().addScaledVector(tail.getTangentAt(1), 0.015));
  }
  return g;
}

function makeModule({ withTags = false, fitted = false } = {}) {
  const m = new THREE.Group();
  // 筒体
  const xs = [], NE = 36;
  for (let k = 0; k < NE; k++) xs.push(BODY0 + CAP * (k / NE) ** 2);
  for (let x = XA; x < BODY1 - CAP; x += 0.02) xs.push(x);
  for (let k = NE; k >= 0; k--) xs.push(BODY1 - CAP * (k / NE) ** 2);
  mesh(tubeGrid(xs, (x, phi, v) => bodyPoint(x, phi, 0, v)), pvc, m);
  // 套筒
  const cx = [];
  for (let k = 0; k <= 70; k++) cx.push(XA * k / 70);
  mesh(tubeGrid(cx, (x, phi, v) => collarPoint(x, phi, fitted, 0, v)), pvc2, m);
  const edge = [];
  for (let j = 0; j < NV; j++) edge.push(collarPoint(0.004, j / NV * TAU, fitted, 0.003));
  mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(edge, true), 240, 0.006, 6, true), pvcRim, m);
  // 裙边（铺在地上，+z 一侧）
  const Z0 = 0.02, Z1 = R + APRON;  // 裙边从筒体底下伸出
  mesh(planeGrid(240, 24, (u, w, v) => {
    const x = u * APRON1, z = Z0 + w * (Z1 - Z0);
    const hem = z > Z1 - 0.05 ? 0.0015 : 0;
    v.set(x, 0.0022 + 0.0014 * (noise(x * 0.9, z * 2.2) + 1) / 2 + hem, z);
  }), apronMat, m);
  mesh(new THREE.BoxGeometry(APRON1, 0.0012, 0.025), pvcRim, m).position.set(APRON1 / 2, 0.0045, R + 0.22);  // 焊缝
  const pitch = EYE_PITCH;
  for (let i = 0; i < N_EYELET; i++) {
    const e = mesh(new THREE.TorusGeometry(0.017, 0.0055, 8, 20), steel, m);
    e.rotation.x = Math.PI / 2;
    e.position.set(EYE_END + i * pitch, 0.0065, Z1 - 0.06);
    const hole = mesh(new THREE.CircleGeometry(0.012, 16), black, m);
    hole.rotation.x = -Math.PI / 2;
    hole.position.set(EYE_END + i * pitch, 0.006, Z1 - 0.06);
  }
  // 侧面 D 环，每侧一排
  for (const x of DRING_X) for (const s of [1, -1]) dring(m, BODY0 + x, s * rad(DRING_ANG));
  // 连接用 D 环（前一节的卡扣挂在这里）
  for (const a of STRAP_ANG) for (const s of [1, -1]) dring(m, BODY1 - CONN_FROM_END, s * rad(a));
  // 套筒上的绑带：固定短带 → 伸缩扣 → 长带过套筒口 → 卡扣；带尾从伸缩扣另一头露出来，拉它收紧
  const cSurf = (x, phi, lift, v) => collarPoint(x, phi, fitted, lift, v);
  for (const a of STRAP_ANG) for (const s of [1, -1]) {
    const phi = s * rad(a);
    const cp = (x, lift, dp = 0) => collarPoint(x, phi + dp, fitted, lift);
    const cn = (x, dp = 0) => {
      const [ca, cb] = collarParams(x, fitted), [nz, ny] = normal(ca, cb, phi + dp);
      return new THREE.Vector3(0, ny, nz);
    };
    const [ca, cb] = collarParams(X_ANCHOR, fitted);
    patch(m, cSurf, X_ANCHOR, phi, 0.05, ca, cb);
    const xm = (X_ANCHOR + X_BUCKLE) / 2;
    ribbon(m, [cp(X_ANCHOR + 0.03, 0.005), cp(xm, 0.005), cp(X_BUCKLE + 0.01, 0.006)],
      [cn(X_ANCHOR + 0.03), cn(xm), cn(X_BUCKLE)], STRAP_W, black);
    camBuckle(m, cp(X_BUCKLE, 0.006), cn(X_BUCKLE));
    const dp = -s * 0.075;  // 带尾往顶部方向偏一点，和固定短带错开
    ribbon(m, [cp(X_BUCKLE + 0.036, 0.016), cp(X_BUCKLE + 0.14, 0.017, dp * 0.45), cp(X_BUCKLE + 0.28, 0.024, dp)],
      [cn(X_BUCKLE), cn(X_BUCKLE + 0.14, dp * 0.45), cn(X_BUCKLE + 0.28, dp)], STRAP_W * 0.95, black);
    const n1 = cn(0);
    const p0 = cp(X_BUCKLE - 0.022, 0.008), pm = cp(X_BUCKLE / 2, 0.008), p1 = cp(0, 0.009);
    let p2, n2, hookTo;
    if (fitted) {  // 套在前一节上：带子拉到前一节的连接 D 环
      const xd = BODY1 - CONN_FROM_END - APRON1;  // 前一节 D 环在本节坐标里的 x
      p2 = bodyPoint(xd + 0.05 + APRON1, phi, 0.012).setX(xd + 0.05);
      const [nz, ny] = normal(SA, SB, phi);
      n2 = new THREE.Vector3(0, ny, nz);
      hookTo = bodyPoint(xd - 0.2 + APRON1, phi, 0.012).setX(xd - 0.2);
    } else {       // 没插东西：4 条带子从套筒口伸出来，卡扣在头上
      p2 = p1.clone().add(new THREE.Vector3(-0.3, -0.03, 0));
      n2 = n1.clone();
      hookTo = p2.clone().add(new THREE.Vector3(-0.3, -0.03, 0));
    }
    ribbon(m, [p0, pm, p1, p2], [cn(X_BUCKLE), cn(X_BUCKLE / 2), n1, n2], STRAP_W, black);
    carabiner(m, p2, hookTo, n2);
  }
  // 进水口 STORZ 52（C 型）带盖和链条
  const sx = BODY1 - A_STORZ;
  patch(m, bodySurf, sx, 0, 0.11);
  const st = frameAt(m, bodyPoint(sx, 0, 0.002), SA, SB, 0);
  mesh(new THREE.CylinderGeometry(0.068, 0.07, 0.012, 40), alu, st).position.y = 0.006;
  for (let i = 0; i < 6; i++) {
    const t = i / 6 * TAU;
    mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.006, 6), steel, st).position.set(0.056 * Math.cos(t), 0.015, 0.056 * Math.sin(t));
  }
  mesh(new THREE.CylinderGeometry(0.044, 0.046, 0.03, 40), alu, st).position.y = 0.027;
  mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.022, 40), steel, st).position.y = 0.053;
  for (const k of [1, -1]) mesh(new THREE.BoxGeometry(0.018, 0.02, 0.024), alu, st).position.set(0.056 * k, 0.058, 0);
  mesh(new THREE.CylinderGeometry(0.047, 0.047, 0.02, 40), alu, st).position.y = 0.074;
  for (const k of [1, -1]) mesh(new THREE.BoxGeometry(0.024, 0.016, 0.018), alu, st).position.set(0, 0.072, 0.054 * k);
  mesh(new THREE.CylinderGeometry(0.03, 0.036, 0.008, 32), alu, st).position.y = 0.088;
  const eye = mesh(new THREE.TorusGeometry(0.008, 0.0022, 6, 14), steel, st);
  eye.position.y = 0.098;
  for (let i = 0; i < 9; i++) {
    const t = (i + 1) / 10;
    const link = mesh(new THREE.TorusGeometry(0.0075, 0.0018, 6, 12), steel, st);
    link.scale.set(1, 1.5, 1);
    link.position.set(-0.07 * t, 0.096 * (1 - t) ** 1.6 + 0.012, 0.035 * Math.sin(t * Math.PI));
    link.rotation.set(i % 2 ? Math.PI / 2 : 0, 0.4, 0.3);
  }
  // 排气阀
  patch(m, bodySurf, BODY0 + VENT_X, 0, 0.07);
  const vt = frameAt(m, bodyPoint(BODY0 + VENT_X, 0, 0.002), SA, SB, 0);
  mesh(new THREE.CylinderGeometry(0.036, 0.04, 0.012, 32), black, vt).position.y = 0.006;
  mesh(new THREE.CylinderGeometry(0.022, 0.025, 0.022, 24), black, vt).position.y = 0.023;
  mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.012, 24), black, vt).position.set(0.075, 0.004, 0.01);
  mesh(new THREE.BoxGeometry(0.05, 0.003, 0.008), black, vt).position.set(0.04, 0.006, 0.006);
  // 出水口：卷起扎紧的软袖口（客户 Rev D 的做法；11-09 定下不用球阀）
  drainSleeve(m);
  // 平头端提手
  const hg = new THREE.TorusGeometry(0.08, 0.01, 6, 28, Math.PI);
  hg.rotateZ(-Math.PI / 2);
  hg.rotateX(Math.PI / 2);
  const h = mesh(hg, black, m);
  h.scale.y = 0.4;
  h.position.set(BODY1 - 0.03, HC + 0.02, 0);

  if (withTags) {
    tag("1", m, new THREE.Vector3(sx - 0.4, 1.0, 0));  // 让开顶上注水口的位置尺寸
    tag("2", m, new THREE.Vector3(7.5, 0.05, R + APRON * 0.55));
    tag("3", m, new THREE.Vector3(0.3, 0.72, 0.15));
    tag("4", m, new THREE.Vector3(BODY0 + DRAIN_X, 0.42, 0.78));
    tag("5", m, new THREE.Vector3(EYE_END + 4 * pitch, 0.06, R + APRON - 0.06));
    tag("6", m, new THREE.Vector3(BODY0 + VENT_X + 0.4, 1.0, 0));  // 让开排气阀的位置尺寸
    tag("7", m, new THREE.Vector3(BODY0 + DRING_X[2], 0.95, 0.45));
    tag("8", m, new THREE.Vector3(-0.3, 0.38, 0.7));
    tag("9", m, collarPoint(X_BUCKLE, rad(STRAP_ANG[1]), false, 0.15));
  }
  return { group: m };
}

function arrowHead(tip, dir) {

function chainDim(xs, y, z, ext, rep) {

    const o = dimLabel(String(mm(xs[i + 1] - xs[i])), V((xs[i] + xs[i + 1]) / 2));
    if (i >= rep[0] && i < rep[1]) each.push(o);

}
